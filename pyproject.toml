[project]
name = "mcp-upbit-demo"
version = "0.1.0"
description = "Upbit 시세 데이터를 조회하는 MCP 서버/클라이언트 데모 (기말 과제)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["servers", "clients"]
